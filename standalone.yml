# Image tags bumped Aug 1 2026 (Penny) to the support-matrix trio validated
# by the official ZK Loan example: node 1.0.0 / proof-server 8.1.0 /
# indexer 4.3.3 — pairs with Midnight.js 4.1.1 + compact-runtime 0.16.0
# (compactc 0.31.1 artifacts). Previous: node 0.22.3 / proof 8.0.3 /
# indexer 4.0.1 (April 2026 generation; funding CLI in src/ still targets
# that older wallet-SDK generation — use the genesis seed directly instead).
services:
  proof-server:
    container_name: 'midnight-proof-server'
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server -v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
  indexer:
    container_name: 'midnight-indexer'
    image: 'midnightntwrk/indexer-standalone:4.3.3'
    env_file: standalone.env.example
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:1.0.0'
    container_name: 'midnight-node'
    ports:
      - '127.0.0.1:9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
